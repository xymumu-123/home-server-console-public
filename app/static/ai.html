<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 助手</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/common.css">
<link rel="stylesheet" href="/static/ai.css">
<script src="/static/theme.js"></script>
<script src="/static/common.js"></script>
<script src="/static/ai.js"></script>
<style>
  body { display: flex; flex-direction: column; }
  .wrap { flex: 1; display: flex; gap: 14px; padding: 14px 22px 0; min-height: 0; }
  .side { width: 240px; flex: none; display: flex; flex-direction: column; gap: 10px; }
  .side .card { padding: 14px 16px; }
  .side h3 { font-size: 13px; color: var(--dim); margin-bottom: 8px; }
  .side .tip { font-size: 12px; color: var(--dim); line-height: 1.8; }
  .main { flex: 1; min-width: 0; display: flex; }
  @media (max-width: 900px) { .side { display: none; } .wrap { padding: 10px 10px 0; } }
  .ai-noperm { text-align: center; padding: 90px 0; font-size: 14px; color: var(--dim); }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">AI 助手</div>
  <nav class="nav">
    <a href="/">中控</a>
    <a href="/ai" class="active">AI</a>
    <a href="/monitor">监控</a>
    <a href="/media">影视</a>
    <a href="/files">文件</a>
    <a href="/downloads">下载</a>
    <a href="/games">游戏</a>
  </nav>
  <div class="tb-actions">
    <button class="theme-btn" onclick="toggleTheme()" title="切换日间/夜间模式">
      <span class="i-moon">🌙</span><span class="i-sun">☀️</span>
    </button>
  </div>
</header>

<div class="wrap boot-guard">
  <div class="side">
    <div class="card">
      <h3>服务器管家</h3>
      <div class="tip">
        可以查看服务器状态、分析问题、重启服务、操作下载机、速查日志——
        能做什么取决于你账号的权限。<br><br>
        对话记忆持久保存, 随时回来继续。
      </div>
    </div>
    <div class="card">
      <button class="btn-ai ai-newbtn" style="width:100%">＋ 开启新对话</button>
    </div>
  </div>
  <div class="main"><div id="airoot" style="flex:1;display:flex"></div></div>
</div>

<div class="ai-noperm boot-guard" id="noperm" style="display:none">没有「AI 助手」权限，请联系管理员开通</div>

<script>
(async () => {
  try {
    const me = await (await fetch('/api/me')).json();
    if (!me.perms.includes('ai')) {
      document.querySelector('.wrap').style.display = 'none';
      document.getElementById('noperm').style.display = 'block';
      return;
    }
    document.body.classList.remove('boot-guard');
    AIChat.init(document.getElementById('airoot'), { compact: false });
    document.querySelector('.ai-newbtn').onclick = async () => {
      await fetch('/api/ai/new', { method: 'POST' });
      document.getElementById('airoot').querySelector('.ai-msgs').innerHTML = '';
    };
  } catch (e) {
    location.href = '/login';
  }
})();
</script>
</body>
</html>
