<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - 服务器中控台</title>
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/theme.js"></script>
<script src="/static/netcheck.js"></script>
<style>
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 20px; position: relative;
  }
  .theme-btn { position: fixed; top: 18px; right: 18px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 40px; width: 330px;
    box-shadow: var(--shadow-lg);
  }
  h1 { font-size: 19px; text-align: center; margin-bottom: 26px; font-weight: 700; }
  .icon { text-align: center; font-size: 40px; margin-bottom: 12px; }
  input {
    width: 100%; padding: 12px 14px; margin-bottom: 16px;
    background: var(--card2); border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); font-size: 15px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 600;
    cursor: pointer; transition: .15s;
  }
  button:hover { filter: brightness(1.08); }
  .err {
    display: none; color: var(--hot); font-size: 13px; text-align: center; margin-bottom: 14px;
  }
</style>
</head>
<body>
<button class="theme-btn" onclick="toggleTheme()" title="切换日间/夜间模式">
  <span class="i-moon">🌙</span><span class="i-sun">☀️</span>
</button>
<div class="card">
  <div class="icon">🖥️</div>
  <h1>服务器中控台</h1>
  <div class="err" id="err">用户名或密码错误</div>
  <form method="post" action="/login">
    <input name="username" placeholder="用户名" autocomplete="username" required>
    <input name="password" type="password" placeholder="密码" autocomplete="current-password" required>
    <button type="submit">登 录</button>
  </form>
</div>
<script>
  const err = new URLSearchParams(location.search).get('err');
  if (err) {
    const el = document.getElementById('err');
    el.textContent = err === '2' ? '尝试次数过多，请 5 分钟后再试' : '用户名或密码错误';
    el.style.display = 'block';
  }
</script>
</body>
</html>
