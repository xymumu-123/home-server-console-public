# 家庭服务器中控台配置文件
# 说明: 每个键的含义见各行注释; 修改后重启服务生效
# 本文件含密钥等敏感信息, 已加入 .gitignore, 请勿上传

[server]
# 监听地址: 0.0.0.0=所有网卡, 127.0.0.1=仅本机
listen_host = 0.0.0.0

# 监听端口 (局域网直接访问; 外网经端口映射/FRP 转发)
listen_port = 8000

# TLS 证书 fullchain PEM 路径 (与 ssl_key 同时配置时, 127.0.0.1:8443 启用 HTTPS; 留空=纯 HTTP)
ssl_cert = 

# TLS 证书私钥 PEM 路径 (配 ssl_cert 使用; 由 acme/acme_issue.py 签发续期)
ssl_key = 

# 会话签名密钥 (64位十六进制)。留空则首次启动自动生成; 更换后所有登录会话失效
secret_key = 

[auth]
# 登录会话有效期 (天)
token_days = 30

# 密码哈希迭代次数 (改小会降低安全性, 仅旧机器性能不足时调整)
pbkdf2_iters = 120000

# 管理员账号名 (不可删除, 权限固定全部)
admin_name = admin

# 首次部署时 admin 的初始密码 (账号已存在时本项无效; 留空则自动生成随机密码并打印在启动日志)
initial_admin_password = 

[monitor]
# 监控采样间隔 (秒)
sample_interval = 2

# 整机功率估算的基础功耗 (瓦), 实际功率 = CPU 功耗 + 本值
baseline_power_w = 15.0

# 监控历史最长保留天数 (自动分级聚合)
long_retention_days = 365

[paths]
# 影视库扫描目录, 逗号分隔多个
media_dirs = D, :, \, N, A, S, \, V, i, d, e, o, s

# 游戏库扫描根目录, 逗号分隔多个
game_dirs = G, :, \, M, o, v, e, N, a, s, \, g, a, m, e, ,,  , H, :, \, G, a, m, e, N, a, s

# 下载机默认下载目录
download_dir = D:\NAS\Downloads

[games]
# 游戏客户端令牌 (setup.bat 与启动器内嵌, 留空则首次启动自动生成; 更换后客户端需重新接入)
games_token = 

# 客户端可访问的服务器地址 (内外网均可达, 如 http://pc2.example.com:18002), 留空则用请求地址
games_server_url = 

# 旧版单目录 UNC 映射 (兼容保留, 推荐用 games_unc_map)
games_unc_base = 

# 本地路径→UNC 前缀映射 (JSON 对象), 客户端启动游戏时把服务器路径替换为可访问的共享路径
games_unc_map = {}

# SMB 专用账户名 (留空则首次启动自动创建为 smbgame; 客户端凭它只读访问游戏共享, 避免存管理员密码)
smb_user = 

# SMB 专用账户密码 (留空则首次启动自动生成随机密码; 改动后需以管理员运行 D:\Monitor\_smb_account.ps1 同步 Windows 账户)
smb_pass = 

# IPv4 备用入口 (SakuraFRP 隧道地址), 供前端提示与切换
frp_url = 

# 游戏租约时长 (小时), 防止两台电脑同时玩同一游戏覆盖存档
lease_hours = 6

# 游戏封面上限 (MB)
cover_max_mb = 8

# 旧版单扫描根 (兼容保留, 推荐用 game_dirs)
games_root = 

# 游戏存档快照根目录 (如 G:\movenas\saves), 留空则游戏库存档功能不可用
saves_root = 

[ai]
# DeepSeek API 密钥 (platform.deepseek.com 申请; AI 助手功能的模型后端)
ai_api_key = 

# AI 助手使用的模型 (deepseek-chat=通用快速, deepseek-reasoner=深度推理)
ai_model = deepseek-chat

[media]
# ffmpeg.exe 完整路径 (缩略图/转码, 留空则相关功能不可用)
ffmpeg_bin = 

# ffprobe.exe 完整路径 (媒体信息探测, 留空则按直连播放)
ffprobe_bin = 

[aria2]
# aria2c.exe 完整路径 (留空=不启用下载机)
aria2_bin = 

# aria2 RPC 端口 (仅本机访问)
aria2_port = 6800

# aria2 RPC 密钥
aria2_secret = 

[ddns]
# 是否启用 DDNS 自动更新
enabled = true

# DDNS 域名 (如 pc2.example.com)
domain = 

# 检查间隔 (分钟)
interval_min = 1

# DNS 服务商回调接口地址
api_url = 

# 回调参数模板, #{domain} 与 #{ip} 会被替换 (本项值内允许出现特殊字符)
api_key = 

# 公网 IP 检测源, 逗号分隔多个
ip_urls = h, t, t, p, s, :, /, /, v, 6, ., i, d, e, n, t, ., m, e, ,,  , h, t, t, p, s, :, /, /, 6, ., i, p, w, ., c, n, ,,  , h, t, t, p, s, :, /, /, a, p, i, 6, ., i, p, i, f, y, ., o, r, g

[probe]
# 用户面 IPv6 端口 (前端线路探测/切换跳转用)
v6_port = 18002

# 测速单次下载块上限 (MB)
down_max_mb = 25

# 测速单次上传块上限 (MB)
up_max_mb = 25

# 测速每 IP 每分钟流量上限 (MB)
volume_limit_mb = 3072

# 探针每 IP 每分钟请求次数上限
rate_per_min = 120

[fs]
# 文件上传单文件上限 (GB); IPv4 备用线路自动降为 100MB
upload_max_gb = 10

[interface]
# 局域网唤醒设备列表 (JSON 数组, 由网页界面管理, 一般无需手改)
wol_devices = []

# 中控页外部链接卡片 (JSON 数组: [{name,url,icon}])
quick_links = []

